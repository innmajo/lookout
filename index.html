<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/app-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lookout — herramienta de análisis PESTEL para registrar, priorizar y reportar factores del entorno." />
    <title>Lookout · Análisis PESTEL</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lookout-theme')
          var tema = 'dark'
          var sector = 'agro'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.state) {
              if (parsed.state.tema === 'light') tema = 'light'
              if (parsed.state.sector) sector = parsed.state.sector
            }
          }
          document.documentElement.setAttribute('data-theme', tema)
          document.documentElement.setAttribute('data-sector', sector)
          document.documentElement.style.colorScheme = tema
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
